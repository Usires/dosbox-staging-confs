[sdl]
output = opengl
fullscreen = true
vsync = true

[cpu]
cputype = auto
cycles = auto
cycleup = 200
cycledown = 200

[mixer]
rate = 44100
blocksize = 1024
prebuffer = 40

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[midi]
mididevice = fluidsynth

[fluidsynth]
soundfont = /usr/share/soundfonts/FluidR3_GM

[render]
glshader = crt-auto
integer_scaling = off

[autoexec]
@echo off
mount C "/home/dirk/Games/SHOCK" -label SHOCK
mount D "/home/dirk/Games/SHOCK_CD" -t cdrom -label SHOCK_CD
C:
cls
echo.
echo.
echo    ===============================================
echo        T E R M I N A T O R
echo          Future Shock (1995)
echo    ===============================================
echo.
echo    [1]  Setup / Konfiguration
echo    [2]  Future Shock starten (default nach 5s)
echo.
choice /c:12 /t:2,5 /n
if errorlevel 2 goto start_game
if errorlevel 1 goto start_setup
echo.
echo    Choice nicht verfuegbar, fallback auf Eingabe ...
set WAHL=2
set /p WAHL=" Druecke [1] oder Enter: "
if "%WAHL%"=="1" goto start_setup
goto start_game
:start_setup
echo.
echo    Starte Setup ...
C:
cd \
SETUP.EXE
goto ende
:start_game
echo.
echo    Starte Future Shock ...
C:
cd \
SHOCK.EXE
:ende
